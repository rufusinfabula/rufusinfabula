name: Aggiorna elenco progetti

on:
  schedule:
    - cron: "17 5 * * *"   # ogni giorno alle 05:17 UTC
  workflow_dispatch:        # avvio manuale da Actions
  push:
    branches: [main]
    paths:
      - ".github/projects.json"
      - ".github/scripts/**"

permissions:
  contents: write

concurrency:
  group: update-projects
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ricostruisci la fascia dei progetti
        run: python3 -I .github/scripts/update_projects.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit se qualcosa è cambiato
        run: |
          if git diff --quiet README.md; then
            echo "Nessuna modifica"
            exit 0
          fi
          git config user.name "Rufusinfabula"
          git config user.email "21293082+rufusinfabula@users.noreply.github.com"
          git add README.md
          git commit -m "Aggiorna elenco progetti"
          git push
